name: Klokkie deployen

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:                       # nach "Stimme erzeugen" automatisch neu veröffentlichen
    workflows: ["Stimme erzeugen"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nur für Piper nötig (wenn es noch keine fertige eigene Stimme gibt)
      - name: Piper-Cache laden
        if: ${{ hashFiles('voice/index.json') == '' }}
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-piper-${{ hashFiles('tools/tts/phrases.tsv', 'tools/tts/Dockerfile', 'tools/tts/generate.sh') }}

      - name: Sprachdateien bereitstellen
        run: |
          if [ -f voice/index.json ]; then
            echo "Nutze fertige Stimme aus voice/"
            rm -rf audio && cp -r voice audio
          else
            echo "Noch keine fertige eigene Stimme, nutze Piper"
            docker build -t klokkie-tts tools/tts
            docker run --rm -v "$PWD/audio:/work/audio" klokkie-tts
            sudo chown -R "$(id -u):$(id -g)" audio
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons audio _site/
          rm -f _site/audio/LIESMICH.txt
          echo "Dateien im Deployment: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
