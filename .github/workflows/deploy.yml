name: Klokkie deployen

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:                       # nach "Stimme erzeugen" automatisch neu veröffentlichen
    workflows: ["Stimme erzeugen"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprachdateien bereitstellen
        run: |
          mkdir -p _site/audio
          if [ -f voice/index.json ]; then
            echo "Nutze fertige ElevenLabs-Stimme aus voice/"
            cp -r voice/. _site/audio/
          else
            echo "Noch keine fertige Stimme: App nutzt die Stimme des Geräts"
            echo '{"version":"geen","files":[]}' > _site/audio/index.json
          fi

      - name: Seite zusammenstellen
        run: |
          cp -r index.html manifest.webmanifest sw.js icons _site/
          echo "Dateien im Deployment: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
